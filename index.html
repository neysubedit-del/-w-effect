<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17191d">
<title>Motion Studio — Mobile</title>
<style>
:root{--bg:#17191d;--panel:#202329;--panel2:#282c33;--line:#393e47;--text:#e8eaf0;--muted:#9aa1ad;--accent:#8b7cff;--cyan:#53c7d9;--orange:#e8a65b;--green:#72c89c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}button{background:#333842;border:1px solid #454b56;border-radius:6px;padding:7px 10px;cursor:pointer}button:active{filter:brightness(1.25)}button.primary{background:#6659d9;border-color:#8176ed}button.active{background:#4b438e;border-color:#958aff}
#app{height:100dvh;display:flex;flex-direction:column;min-width:600px}
.top{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111317;border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:.4px;margin-right:8px;white-space:nowrap}.brand b{color:var(--accent)}
.top .spacer{flex:1}.status{color:var(--muted);font-size:11px;white-space:nowrap}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:1px;background:var(--line)}
.center{min-width:0;display:flex;flex-direction:column;background:#191b20}
.viewer-head,.panel-head{height:34px;flex:none;background:#22252b;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:10px;color:#c9cdd5}
.viewer{flex:1;min-height:130px;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(#292d35 1px,transparent 1px);background-size:18px 18px;position:relative;overflow:hidden}
.stage{position:relative;width:min(100%,900px);aspect-ratio:16/9;background:#090a0c;box-shadow:0 8px 30px #0009;overflow:hidden}
#mediaImage,#mediaVideo{position:absolute;max-width:none;max-height:none;transform-origin:center center;display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#707783;text-align:center;line-height:1.8}
#overlay{position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff14}
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.panel-head{justify-content:space-between}
.props{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.section-title{font-size:11px;color:#aeb4bf;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
.field{display:grid;grid-template-columns:62px 1fr 48px;align-items:center;gap:6px;margin:7px 0;color:#b9c0ca}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field input[type=number]{width:100%;background:#15171b;border:1px solid #3c424c;border-radius:4px;padding:5px}
.field select{grid-column:2/4;width:100%;background:#15171b;border:1px solid #3c424c;border-radius:4px;padding:6px}
.keyline{display:flex;gap:6px;align-items:center}.keyline button{flex:1}
.transport{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#202329;border-top:1px solid var(--line)}
.timecode{font-variant-numeric:tabular-nums;color:#d7d9e0;min-width:78px}
.timeline{height:220px;flex:none;background:#1c1f24;display:flex;flex-direction:column;border-top:1px solid #101216}
.tl-toolbar{height:38px;flex:none;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid var(--line)}
.tl-body{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr);overflow:hidden}
.layer-list{background:#22252b;border-right:1px solid var(--line);overflow:auto}
.layer-row{height:46px;border-bottom:1px solid #363b44;padding:6px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.layer-row.selected{background:#39345f}.layer-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.track-scroll{overflow:auto;position:relative;background:#191b20;touch-action:pan-x pan-y}
.ruler{height:25px;position:sticky;top:0;background:#252930;border-bottom:1px solid #454b55;z-index:4;min-width:100%}
.ruler-mark{position:absolute;top:0;height:100%;border-left:1px solid #545b66;padding-left:3px;color:#aeb5c0;font-size:10px;padding-top:5px}
.track-area{position:relative;min-height:100%;min-width:100%}
.track-row{height:46px;border-bottom:1px solid #30353e;position:relative}
.clip{position:absolute;top:8px;height:29px;border-radius:4px;background:#4b477f;border:1px solid #8075d8;display:flex;align-items:center;padding:0 7px;font-size:11px;overflow:hidden;white-space:nowrap}
.key-dot{position:absolute;top:18px;width:10px;height:10px;background:#f0c36c;border:1px solid #fff1;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);z-index:2}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:#ff6d74;z-index:5;pointer-events:none}
.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #ff6d74}
.small{font-size:11px;color:var(--muted)}.iconbtn{padding:5px 8px}.hidden{display:none!important}
input[type=file]{display:none}
@media(max-height:500px){.timeline{height:170px}.top{height:40px}.viewer-head{height:28px}.transport{height:36px}.props{gap:7px;padding:7px}}
@media(orientation:portrait){#app:before{content:"横向きにすると編集しやすくなります";position:fixed;right:8px;top:48px;z-index:20;background:#39345f;color:white;padding:6px 9px;border-radius:5px;font-size:11px;pointer-events:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>✦</b> MOTION STUDIO</div>
    <button class="primary" id="importBtn">＋ 読み込み</button>
    <button id="saveBtn">保存</button><button id="openProjectBtn">開く</button>
    <span class="spacer"></span><span class="status" id="status">Untitled Project · 30 fps</span>
  </header>
  <input id="mediaPicker" type="file" accept="image/*,video/*" multiple>
  <input id="projectPicker" type="file" accept=".json,application/json">
  <div class="workspace">
    <main class="center">
      <div class="viewer-head"><span>コンポジション</span><span class="spacer"></span><span class="small">1920 × 1080</span><span class="small">100%</span></div>
      <div class="viewer">
        <div class="stage" id="stage">
          <div id="empty">メディアを読み込んでください<br>写真・動画をタイムラインに追加できます</div>
          <img id="mediaImage" alt="">
          <video id="mediaVideo" playsinline muted></video>
          <div id="overlay"></div>
        </div>
      </div>
      <div class="transport">
        <button class="iconbtn" id="toStart">|◀</button><button class="iconbtn primary" id="playBtn">▶</button><button class="iconbtn" id="toEnd">▶|</button>
        <span class="timecode" id="timecode">00:00:00:00</span>
        <span class="small">時間</span><input id="timeRange" type="range" min="0" max="10" step=".001" value="0" style="flex:1;accent-color:var(--accent)">
        <span class="small" id="durationLabel">10.0s</span>
      </div>
    </main>
    <aside class="side">
      <div class="panel-head"><span>エフェクトコントロール</span><span class="small" id="selectedLabel">未選択</span></div>
      <div class="props">
        <section><div class="section-title">トランスフォーム</div>
          <div class="field"><span>位置 X</span><input id="xRange" type="range" min="-960" max="960" value="0"><input id="xNum" type="number" value="0"></div>
          <div class="field"><span>位置 Y</span><input id="yRange" type="range" min="-540" max="540" value="0"><input id="yNum" type="number" value="0"></div>
          <div class="field"><span>スケール</span><input id="scaleRange" type="range" min="1" max="300" value="100"><input id="scaleNum" type="number" value="100"></div>
          <div class="field"><span>回転</span><input id="rotRange" type="range" min="-360" max="360" value="0"><input id="rotNum" type="number" value="0"></div>
          <div class="field"><span>不透明度</span><input id="opacityRange" type="range" min="0" max="100" value="100"><input id="opacityNum" type="number" value="100"></div>
          <div class="keyline"><button id="addKey" class="primary">◆ キーフレーム追加</button><button id="prevKey">◀◆</button><button id="nextKey">◆▶</button></div>
        </section>
        <section><div class="section-title">キーフレーム補間</div>
          <div class="field" style="grid-template-columns:62px 1fr"><span>イージング</span><select id="easeSelect"><option value="linear">Linear</option><option value="ease">Easy Ease</option><option value="in">Ease In</option><option value="out">Ease Out</option></select></div>
          <div class="small">選択中レイヤーの、現在位置以降の補間に適用します。</div>
        </section>
        <section><div class="section-title">レイヤー</div><div class="small" id="layerInfo">メディア未読み込み</div><button id="deleteLayer" style="margin-top:8px;width:100%">選択レイヤーを削除</button></section>
      </div>
    </aside>
  </div>
  <section class="timeline">
    <div class="tl-toolbar"><b>タイムライン</b><button id="addMedia" class="iconbtn">＋ レイヤー</button><button id="zoomOut" class="iconbtn">−</button><button id="zoomIn" class="iconbtn">＋</button><span class="spacer"></span><span class="small">ドラッグで時間移動 · ◆がキーフレーム</span></div>
    <div class="tl-body">
      <div class="layer-list" id="layerList"></div>
      <div class="track-scroll" id="trackScroll"><div class="ruler" id="ruler"></div><div class="track-area" id="trackArea"><div class="playhead" id="playhead"></div></div></div>
    </div>
  </section>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const state={layers:[],selected:null,time:0,duration:10,fps:30,scale:70,playing:false,last:0,raf:0};
const propIds={x:['xRange','xNum'],y:['yRange','yNum'],scale:['scaleRange','scaleNum'],rotation:['rotRange','rotNum'],opacity:['opacityRange','opacityNum']};
const defaults=()=>({x:0,y:0,scale:100,rotation:0,opacity:100});
const current=()=>state.layers.find(l=>l.id===state.selected);
function fmt(t){let f=Math.floor(t*state.fps),s=Math.floor(f/state.fps),fr=f%state.fps,m=Math.floor(s/60),sec=s%60;return [m,sec,fr].map(v=>String(v).padStart(2,'0')).join(':')}
function setStatus(s){$('status').textContent=s}
function interp(a,b,p,mode){if(mode==='ease')p=p*p*(3-2*p);else if(mode==='in')p=p*p;else if(mode==='out')p=1-(1-p)*(1-p);return a+(b-a)*p}
function valuesAt(layer,t){
 const keys=layer.keys.slice().sort((a,b)=>a.t-b.t);
 if(!keys.length)return {...layer.base};
 let prev=keys[0];if(t<=prev.t)return {...prev.v};
 for(let i=1;i<keys.length;i++){let next=keys[i];if(t<=next.t){let p=(t-prev.t)/(next.t-prev.t||1);let v={};for(let k in prev.v)v[k]=interp(prev.v[k],next.v[k],p,next.ease||'linear');return v}prev=next}
 return {...prev.v};
}
function applyPreview(){
 const l=current();if(!l){$('empty').classList.remove('hidden');$('mediaImage').style.display='none';$('mediaVideo').style.display='none';return}
 $('empty').classList.add('hidden');
 const v=valuesAt(l,state.time),el=l.type==='video'?'mediaVideo':'mediaImage';
 const other=l.type==='video'?'mediaImage':'mediaVideo';$(other).style.display='none';$(el).style.display='block';
 const w=l.type==='video'?$('mediaVideo').videoWidth:$('mediaImage').naturalWidth;
 const h=l.type==='video'?$('mediaVideo').videoHeight:$('mediaImage').naturalHeight;
 if(w&&h){let fit=Math.min(1920/w,1080/h);$(el).style.width=(w*fit)+'px';$(el).style.height=(h*fit)+'px';}
 $(el).style.left='50%';$(el).style.top='50%';
 $(el).style.transform=`translate(calc(-50% + ${v.x/1920*100}% ),calc(-50% + ${v.y/1080*100}%)) scale(${v.scale/100}) rotate(${v.rotation}deg)`;
 $(el).style.opacity=v.opacity/100;
 if(l.type==='video'&&Math.abs($('mediaVideo').currentTime-state.time)>0.12){$('mediaVideo').currentTime=Math.min(state.time,l.duration||state.duration)}
 for(let k in propIds){$(propIds[k][0]).value=v[k];$(propIds[k][1]).value=v[k]}
 $('selectedLabel').textContent=l.name;$('layerInfo').textContent=`${l.type.toUpperCase()} · ${l.keys.length} keyframes`;
 $('timecode').textContent=fmt(state.time);$('timeRange').value=state.time;
 $('playhead').style.left=(state.time*state.scale)+'px';
}
function renderTimeline(){
 $('layerList').innerHTML='';$('trackArea').innerHTML='<div class="playhead" id="playhead"></div>';
 $('trackArea').style.width=Math.max(600,state.duration*state.scale)+'px';$('ruler').style.width=Math.max(600,state.duration*state.scale)+'px';$('ruler').innerHTML='';
 for(let s=0;s<=state.duration;s+=1){let d=document.createElement('div');d.className='ruler-mark';d.style.left=(s*state.scale)+'px';d.textContent=s+'s';$('ruler').append(d)}
 state.layers.forEach((l,i)=>{
  let row=document.createElement('div');row.className='layer-row'+(l.id===state.selected?' selected':'');row.innerHTML=`<span style="color:${l.type==='video'?'#66c8d9':'#c19aff'}">▰</span><span class="layer-name"></span>`;row.querySelector('.layer-name').textContent=l.name;row.onclick=()=>selectLayer(l.id);$('layerList').append(row);
  let tr=document.createElement('div');tr.className='track-row';tr.style.width=Math.max(600,state.duration*state.scale)+'px';
  let clip=document.createElement('div');clip.className='clip';clip.style.left='0px';clip.style.width=(Math.min(state.duration,l.duration||state.duration)*state.scale)+'px';clip.textContent=l.name;tr.append(clip);
  l.keys.forEach(k=>{let dot=document.createElement('div');dot.className='key-dot';dot.style.left=(k.t*state.scale)+'px';dot.title=`${k.t.toFixed(2)}s`;dot.onclick=()=>{state.time=k.t;syncTime()};tr.append(dot)});
  $('trackArea').append(tr);
 });
 $('playhead').style.left=(state.time*state.scale)+'px';
}
function selectLayer(id){state.selected=id;let l=current();if(l){for(let k in propIds){$(propIds[k][0]).value=l.base[k];$(propIds[k][1]).value=l.base[k]}}renderTimeline();applyPreview()}
function syncTime(){state.time=Math.max(0,Math.min(state.duration,Number(state.time)));$('timeRange').value=state.time;$('timecode').textContent=fmt(state.time);$('playhead').style.left=(state.time*state.scale)+'px';applyPreview()}
function addKey(){let l=current();if(!l)return;let v={};for(let k in propIds)v[k]=Number($(propIds[k][1]).value);let old=l.keys.find(k=>Math.abs(k.t-state.time)<.02);if(old)old.v=v;else l.keys.push({t:state.time,v,ease:$('easeSelect').value});l.keys.sort((a,b)=>a.t-b.t);renderTimeline();applyPreview();setStatus('キーフレームを追加しました')}
function changeProp(k,val){let l=current();if(!l)return;val=Number(val);l.base[k]=val;$(propIds[k][0]).value=val;$(propIds[k][1]).value=val;let key=l.keys.find(a=>Math.abs(a.t-state.time)<.02);if(key)key.v[k]=val;applyPreview()}
function addFiles(files){[...files].forEach(file=>{if(!file.type.startsWith('image/')&&!file.type.startsWith('video/'))return;let url=URL.createObjectURL(file),type=file.type.startsWith('video/')?'video':'image',id='L'+Date.now()+Math.random().toString(16).slice(2);let l={id,name:file.name,type,url,duration:type==='video'?state.duration:state.duration,base:defaults(),keys:[]};state.layers.push(l);state.selected=id;if(type==='video'){$('mediaVideo').src=url;$('mediaVideo').load();$('mediaVideo').onloadedmetadata=()=>{l.duration=$('mediaVideo').duration||state.duration;state.duration=Math.max(state.duration,Math.min(60,l.duration));$('durationLabel').textContent=state.duration.toFixed(1)+'s';$('timeRange').max=state.duration;renderTimeline()}}else{$('mediaImage').src=url} });renderTimeline();applyPreview();setStatus('メディアを読み込みました')}
$('importBtn').onclick=$('addMedia').onclick=()=>$('mediaPicker').click();
$('mediaPicker').onchange=e=>addFiles(e.target.files);
$('addKey').onclick=addKey;
for(let k in propIds){let [r,n]=propIds[k];$(r).oninput=()=>changeProp(k,$(r).value);$(n).onchange=()=>changeProp(k,$(n).value)}
$('easeSelect').onchange=()=>{let l=current();if(!l)return;let key=l.keys.filter(k=>k.t>=state.time-.001).sort((a,b)=>a.t-b.t)[0];if(key){key.ease=$('easeSelect').value;renderTimeline();setStatus('補間モードを変更しました')}};
$('timeRange').oninput=e=>{state.time=Number(e.target.value);syncTime()};
$('toStart').onclick=()=>{state.time=0;syncTime()};$('toEnd').onclick=()=>{state.time=state.duration;syncTime()};
$('prevKey').onclick=()=>{let l=current();if(!l)return;let ks=l.keys.filter(k=>k.t<state.time-.01).sort((a,b)=>b.t-a.t);if(ks[0]){state.time=ks[0].t;syncTime()}};
$('nextKey').onclick=()=>{let l=current();if(!l)return;let ks=l.keys.filter(k=>k.t>state.time+.01).sort((a,b)=>a.t-b.t);if(ks[0]){state.time=ks[0].t;syncTime()}};
function tick(ts){if(!state.playing)return;if(!state.last)state.last=ts;state.time+=(ts-state.last)/1000;state.last=ts;if(state.time>=state.duration){state.time=0}syncTime();state.raf=requestAnimationFrame(tick)}
$('playBtn').onclick=()=>{state.playing=!state.playing;$('playBtn').textContent=state.playing?'Ⅱ':'▶';state.last=0;if(state.playing)state.raf=requestAnimationFrame(tick);else cancelAnimationFrame(state.raf)};
$('zoomIn').onclick=()=>{state.scale=Math.min(180,state.scale+10);renderTimeline()};$('zoomOut').onclick=()=>{state.scale=Math.max(25,state.scale-10);renderTimeline()};
$('trackScroll').addEventListener('pointerdown',e=>{if(e.target.classList.contains('key-dot'))return;const rect=$('trackArea').getBoundingClientRect();let t=(e.clientX-rect.left)/state.scale;state.time=Math.max(0,Math.min(state.duration,t));syncTime()});
$('deleteLayer').onclick=()=>{let i=state.layers.findIndex(l=>l.id===state.selected);if(i<0)return;URL.revokeObjectURL(state.layers[i].url);state.layers.splice(i,1);state.selected=state.layers[Math.max(0,i-1)]?.id||null;renderTimeline();applyPreview()};
$('saveBtn').onclick=()=>{let data={version:1,duration:state.duration,fps:state.fps,layers:state.layers.map(l=>({name:l.name,type:l.type,duration:l.duration,base:l.base,keys:l.keys}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='motion-studio-project.json';a.click();URL.revokeObjectURL(a.href);setStatus('プロジェクト設定をJSON保存しました（メディア本体は含みません）')};
$('openProjectBtn').onclick=()=>$('projectPicker').click();
$('projectPicker').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());state.duration=d.duration||10;state.fps=d.fps||30;state.layers=d.layers||[];state.selected=state.layers[0]?.id||null;setStatus('設定を読み込みました。メディアは再読み込みしてください');renderTimeline();applyPreview()}catch(err){alert('プロジェクトファイルを読み込めませんでした')}};
$('durationLabel').textContent=state.duration.toFixed(1)+'s';renderTimeline();applyPreview();
})();
</script>
</body>
</html>
