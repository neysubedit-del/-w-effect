<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motion Studio Timing Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#eef0f6;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,select,input{font:inherit;color:inherit}button,select{background:#303644;border:1px solid #4a5262;border-radius:7px;padding:7px 10px}button.primary{background:#705de0}header{height:50px;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#171a21;border-bottom:1px solid #383e49;overflow:auto;white-space:nowrap}header b{margin-right:8px}.status{margin-left:auto;color:#aab1bf;font-size:11px}.app{height:calc(100dvh - 50px);display:grid;grid-template-rows:minmax(130px,1fr) 8px minmax(160px,34%)}.upper{display:grid;grid-template-columns:minmax(0,1fr) minmax(205px,27%);min-height:0}.viewer{display:flex;flex-direction:column;min-width:0;background:#191c23}.bar{height:30px;padding:7px 10px;background:#242934;color:#aeb5c2;font-size:12px}.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}.stage{max-width:100%;max-height:100%;aspect-ratio:16/9;width:min(100%,900px);background:#050608}.stage canvas{width:100%;height:100%;display:block}.inspector{background:#222630;border-left:1px solid #3a404c;overflow:auto;padding:9px}.inspector h3{font-size:13px;margin:5px 0 10px}.field{display:grid;grid-template-columns:62px 1fr 48px;gap:5px;align-items:center;margin:8px 0}.field input[type=range]{width:100%}.field input[type=number]{width:48px;background:#13161c;border:1px solid #414958;border-radius:5px;padding:4px}.row{display:flex;gap:5px;flex-wrap:wrap}.note{color:#aab1bf;font-size:10px;line-height:1.5;margin-top:10px}.resize{background:#39404c;touch-action:none}.timeline{min-height:0;display:flex;flex-direction:column;background:#1b1e25}.tools{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #39404a;overflow:auto;white-space:nowrap}.tools label{font-size:11px;color:#aab1bf}.tools input{width:60px;background:#12151a;border:1px solid #39404a;border-radius:4px}.tracks{flex:1;min-height:0;display:grid;grid-template-columns:105px minmax(0,1fr)}.names{border-right:1px solid #3a404c}.name,.track{height:39px;border-bottom:1px solid #343a45}.name{padding:12px 7px;font-size:11px}.scroller{overflow:auto;position:relative;touch-action:pan-x pan-y}.ruler{height:25px;position:relative;border-bottom:1px solid #444b59;background:repeating-linear-gradient(90deg,transparent 0,transparent 99px,#3b414e 100px)}.ruler span{position:absolute;top:5px;font-size:10px;color:#aab1bf}.track{position:relative;min-width:100%;background:repeating-linear-gradient(90deg,transparent 0,transparent 99px,#303642 100px)}.clip{position:absolute;left:0;top:6px;height:26px;background:#50459b;border:1px solid #8979f2;border-radius:4px;min-width:4px}.diamond{position:absolute;top:13px;width:11px;height:11px;background:#ffd05c;border:1px solid white;transform:translateX(-50%) rotate(45deg)}.diamond.remap{background:#65d8bd}.head{position:absolute;top:0;bottom:0;width:2px;background:#ff6979;pointer-events:none;z-index:5}.hidden{display:none}
@media(max-width:700px){.upper{grid-template-columns:minmax(0,1fr) 195px}.field{grid-template-columns:54px 1fr 44px;gap:3px}.field input[type=number]{width:44px}.tracks{grid-template-columns:88px minmax(0,1fr)}header b{font-size:12px}}
@media(orientation:portrait){body:after{content:"横向きでの操作をおすすめします";position:fixed;bottom:5px;right:5px;background:#51469b;padding:5px 8px;border-radius:5px;font-size:10px}}
</style></head><body>
<header><b>✦ MOTION STUDIO / TIMING LAB</b><button class="primary" id="import">＋読み込み</button><button id="key">◆キー追加</button><button id="play">▶</button><button id="export">書き出し</button><span class="status" id="status">素材未読み込み</span><input id="file" type="file" accept="video/*,image/*" hidden></header>
<main class="app" id="app"><section class="upper"><section class="viewer"><div class="bar" id="meta">コンポジション / 自動サイズ / FPS — / 0.000s</div><div class="stageWrap"><div class="stage" id="stage"><canvas id="canvas" width="1920" height="1080"></canvas></div></div></section>
<aside class="inspector"><h3>トランスフォーム</h3>
<div class="field"><label>X</label><input id="x" type="range" min="-2000" max="2000" value="0"><input id="xN" type="number" value="0"></div>
<div class="field"><label>Y</label><input id="y" type="range" min="-2000" max="2000" value="0"><input id="yN" type="number" value="0"></div>
<div class="field"><label>Scale</label><input id="scale" type="range" min="0" max="400" value="100"><input id="scaleN" type="number" value="100"></div>
<div class="field"><label>回転</label><input id="rotation" type="range" min="-360" max="360" value="0"><input id="rotationN" type="number" value="0"></div>
<div class="field"><label>Opacity</label><input id="opacity" type="range" min="0" max="100" value="100"><input id="opacityN" type="number" value="100"></div>
<h3>時間補間</h3><div class="row"><button id="easy">Easy Ease</button><button id="in">Ease In</button><button id="out">Ease Out</button><button id="linear">Linear</button></div>
<h3 style="margin-top:16px">タイムリマップ</h3><div class="field"><label>速度%</label><input id="speed" type="range" min="-400" max="400" value="100"><input id="speedN" type="number" value="100"></div>
<div class="row"><button id="remap">有効化</button><button id="remapKey">時間キー追加</button><button id="freeze">フリーズ</button></div>
<p class="note">Easy EaseはAE標準の初期値に相当するベジェ補間（影響度約33.333%、速度0）を使います。速度/影響度を自由に編集するGraph Editorは未実装です。タイムリマップキーは「出力時間→元動画時間」を定義します。</p></aside></section>
<div class="resize" id="resize"></div><section class="timeline"><div class="tools"><button id="minus">−</button><button id="plus">＋</button><label>ズーム <span id="zoom">100</span>px/s</label><label>出力FPS</label><select id="fps"><option value="source">元動画FPS（手動指定）</option><option>24</option><option>25</option><option>30</option><option>50</option><option>60</option></select><span style="font-size:10px;color:#aab1bf">タイムラインをタップして時間移動</span></div><div class="tracks"><div class="names"><div class="name">素材</div><div class="name">キーフレーム</div><div class="name">タイムリマップ</div></div><div class="scroller" id="scroll"><div class="ruler" id="ruler"></div><div class="track" id="media"><div class="clip" id="clip"></div></div><div class="track" id="keys"></div><div class="track" id="remaps"></div><div class="head" id="head"></div></div></div></section></main>
<video id="video" playsinline muted preload="auto" class="hidden"></video><img id="image" class="hidden">
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const S={url:null,type:'',name:'',w:1920,h:1080,dur:10,fps:30,t:0,zoom:100,ready:false,playing:false,raf:0,last:0,keys:[],rk:[],remap:false};
const base=()=>({x:0,y:0,scale:100,rotation:0,opacity:100});
function info(){ $('meta').textContent=`コンポジション / ${S.w}×${S.h} / FPS ${S.fps} / ${S.t.toFixed(3)}s`; }
function fitComp(){canvas.width=S.w;canvas.height=S.h;$('stage').style.aspectRatio=S.w+'/'+S.h;info();}
function loadFile(f){if(S.url)URL.revokeObjectURL(S.url);S.url=URL.createObjectURL(f);S.name=f.name;S.type=f.type.startsWith('video/')?'video':'image';S.keys=[];S.rk=[];S.remap=false;S.t=0;S.ready=false;
 if(S.type==='video'){let v=$('video');v.src=S.url;v.onloadedmetadata=()=>{S.w=v.videoWidth||1920;S.h=v.videoHeight||1080;S.dur=v.duration||10;S.fps=30;fitComp();S.ready=true;render();timeline();$('status').textContent=f.name+' / '+S.dur.toFixed(2)+'s';};v.onloadeddata=()=>{S.ready=true;render()}}
 else{let im=$('image');im.onload=()=>{S.w=im.naturalWidth||1920;S.h=im.naturalHeight||1080;S.dur=10;S.fps=30;fitComp();S.ready=true;render();timeline();$('status').textContent=f.name};im.src=S.url}}
function bez(t,a,b){return 3*(1-t)*(1-t)*t*a+3*(1-t)*t*t*b+t*t*t}
function ease(u,m){if(m==='linear')return u;let x1=.333333,y1=0,x2=.666667,y2=1;if(m==='in'){x2=1;y2=1}else if(m==='out'){x1=0;y1=0}let lo=0,hi=1,z=u;for(let i=0;i<24;i++){z=(lo+hi)/2;if(bez(z,x1,x2)<u)lo=z;else hi=z}return bez(z,y1,y2)}
function values(t){let a=[...S.keys].sort((x,y)=>x.t-y.t);if(!a.length)return base();if(t<=a[0].t)return {...a[0].v};if(t>=a.at(-1).t)return {...a.at(-1).v};let i=0;while(t>a[i+1].t)i++;let p=a[i],q=a[i+1],u=ease((t-p.t)/(q.t-p.t),p.ease||'linear'),v={};for(let k in base())v[k]=p.v[k]+(q.v[k]-p.v[k])*u;return v}
function srcTime(t){if(!S.remap||!S.rk.length)return t;let a=[...S.rk].sort((x,y)=>x.t-y.t);if(t<=a[0].t)return a[0].src;if(t>=a.at(-1).t)return a.at(-1).src;let i=0;while(t>a[i+1].t)i++;let p=a[i],q=a[i+1],u=ease((t-p.t)/(q.t-p.t),p.ease||'linear');return p.src+(q.src-p.src)*u}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#050608';ctx.fillRect(0,0,canvas.width,canvas.height);if(!S.ready)return;let v=values(S.t);ctx.save();ctx.globalAlpha=v.opacity/100;ctx.translate(S.w/2+v.x,S.h/2+v.y);ctx.rotate(v.rotation*Math.PI/180);ctx.scale(v.scale/100,v.scale/100);
 if(S.type==='image'){let im=$('image'),f=Math.min(S.w/im.naturalWidth,S.h/im.naturalHeight);ctx.drawImage(im,-im.naturalWidth*f/2,-im.naturalHeight*f/2,im.naturalWidth*f,im.naturalHeight*f)}
 else{let el=$('video');if(el.readyState>=2){let f=Math.min(S.w/el.videoWidth,S.h/el.videoHeight);ctx.drawImage(el,-el.videoWidth*f/2,-el.videoHeight*f/2,el.videoWidth*f,el.videoHeight*f)}}ctx.restore();info()}
function timeline(){let w=Math.max(1000,S.dur*S.zoom);for(let id of ['ruler','media','keys','remaps'])$(id).style.width=w+'px';$('clip').style.width=S.dur*S.zoom+'px';$('clip').textContent=S.name;$('ruler').innerHTML='';for(let t=0;t<=S.dur;t++){let e=document.createElement('span');e.textContent=t+'s';e.style.left=(t*S.zoom+4)+'px';$('ruler').append(e)}
 $('keys').innerHTML='';S.keys.forEach(k=>marker($('keys'),k.t,'',()=>{S.t=k.t;sync()}));$('remaps').innerHTML='';S.rk.forEach(k=>marker($('remaps'),k.t,'remap',()=>{S.t=k.t;sync()}));$('head').style.left=S.t*S.zoom+'px';$('zoom').textContent=S.zoom}
function marker(parent,t,cls,fn){let d=document.createElement('div');d.className='diamond '+cls;d.style.left=t*S.zoom+'px';d.onclick=e=>{e.stopPropagation();fn()};parent.append(d)}
function sync(){S.t=Math.max(0,Math.min(S.dur,S.t));if(S.type==='video'&&!S.playing){try{$('video').currentTime=Math.max(0,Math.min(S.dur,srcTime(S.t)))}catch(e){}}render();timeline()}
function addKey(){let v=values(S.t);S.keys.push({t:S.t,v:{...v},ease:'easy'});fields(v);timeline()}
function fields(v){for(let k of Object.keys(base())){$(k).value=v[k];$(k+'N').value=v[k]}}
function prop(k,val){let v=values(S.t);v[k]=Number(val);let i=S.keys.findIndex(x=>Math.abs(x.t-S.t)<.001);if(i<0)S.keys.push({t:S.t,v,ease:'easy'});else S.keys[i].v=v;render();timeline()}
function setEase(m){let i=S.keys.findIndex(k=>Math.abs(k.t-S.t)<.001);if(i<0){addKey();i=S.keys.length-1}S.keys[i].ease=m;timeline();$('status').textContent='補間: '+m}
function addRemap(){if(S.type!=='video'){alert('タイムリマップは動画で使えます');return}S.remap=true;S.rk.push({t:S.t,src:$('video').currentTime||S.t,ease:'linear'});timeline()}
function tick(){if(!S.playing)return;let n=performance.now();if(!S.last)S.last=n;S.t+=(n-S.last)/1000;S.last=n;if(S.t>S.dur)S.t=0;let st=srcTime(S.t);if(S.type==='video'&&S.remap&&Math.abs($('video').currentTime-st)>.06)$('video').currentTime=Math.max(0,Math.min(S.dur,st));render();timeline();S.raf=requestAnimationFrame(tick)}
$('import').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);$('key').onclick=addKey;
$('play').onclick=()=>{S.playing=!S.playing;$('play').textContent=S.playing?'Ⅱ':'▶';S.last=0;if(S.playing){if(S.type==='video'&&!S.remap)$('video').play().catch(()=>{});S.raf=requestAnimationFrame(tick)}else{cancelAnimationFrame(S.raf);$('video').pause()}};
for(let k of Object.keys(base())){$(k).oninput=e=>{$(k+'N').value=e.target.value;prop(k,e.target.value)};$(k+'N').onchange=e=>{$(k).value=e.target.value;prop(k,e.target.value)}}
$('easy').onclick=()=>setEase('easy');$('in').onclick=()=>setEase('in');$('out').onclick=()=>setEase('out');$('linear').onclick=()=>setEase('linear');
$('remap').onclick=()=>{if(S.type!=='video'){alert('先に動画を読み込んでください');return}S.remap=true;if(!S.rk.length)S.rk=[{t:0,src:0,ease:'linear'},{t:S.dur,src:S.dur,ease:'linear'}];timeline()};
$('remapKey').onclick=addRemap;$('freeze').onclick=()=>{if(!S.remap)addRemap();let st=srcTime(S.t);S.rk.push({t:S.t,src:st,ease:'linear'},{t:Math.min(S.dur,S.t+1),src:st,ease:'linear'});timeline()};
$('plus').onclick=()=>{S.zoom=Math.min(500,S.zoom*1.25);timeline()};$('minus').onclick=()=>{S.zoom=Math.max(20,S.zoom/1.25);timeline()};
$('scroll').onclick=e=>{if(e.target.classList.contains('diamond'))return;let r=$('scroll').getBoundingClientRect();S.t=Math.max(0,Math.min(S.dur,(e.clientX-r.left+$('scroll').scrollLeft)/S.zoom));sync()};
$('resize').onpointerdown=e=>{let app=$('app'),start=e.clientY,h=app.getBoundingClientRect().height;let move=ev=>{let th=Math.max(150,Math.min(h*.65,h-(ev.clientY-app.getBoundingClientRect().top)));app.style.gridTemplateRows=`minmax(120px,1fr) 8px ${th}px`};let stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)};
function supportedMime(){return ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))}
$('export').onclick=async()=>{if(!S.ready){alert('素材を読み込んでください');return}if(!window.MediaRecorder||!canvas.captureStream){alert('このSafariでは動画書き出し非対応です');return}let mime=supportedMime();if(!mime){alert('対応する動画形式がありません');return}let fps=$('fps').value==='source'?S.fps:Number($('fps').value),stream=canvas.captureStream(0),track=stream.getVideoTracks()[0],chunks=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14000000}),old=S.t;S.playing=false;cancelAnimationFrame(S.raf);$('video').pause();rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='motion-studio.'+(mime.includes('mp4')?'mp4':'webm');a.click();S.t=old;sync();$('status').textContent=`出力設定 ${fps}fps（実fps保証なし）`};rec.start();let interval=1000/fps,total=Math.ceil(S.dur*fps);for(let i=0;i<total;i++){S.t=i/fps;let st=srcTime(S.t);if(S.type==='video'){let v=$('video');await new Promise(resolve=>{let done=false,finish=()=>{if(done)return;done=true;v.removeEventListener('seeked',finish);resolve()};v.addEventListener('seeked',finish);v.currentTime=Math.max(0,Math.min(S.dur,st));setTimeout(finish,Math.max(120,interval*4))})}render();if(track.requestFrame)track.requestFrame();await new Promise(r=>setTimeout(r,interval))}rec.stop();stream.getTracks().forEach(t=>t.stop())};
fitComp();timeline();render();
</script></body></html>
